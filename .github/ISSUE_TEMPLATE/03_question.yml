name: ❓ 質問
description: 使い方や仕様など、わからないことを質問する
title: "[Question] "
labels:
  - question
body:
  - type: textarea
    id: question
    attributes:
      label: 💬 質問内容
      description: 何について知りたいか、具体的に記載してください
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: 🔍 試したこと・調べたこと
      description: 自分で調べた内容や試したことがあれば記載してください
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 📎 補足
      description: 参考リンク、スクリーンショットなどがあれば記載してください
    validations:
      required: false
